[package]
name = "soldering-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
bincode = "=2.0.1"
bincode1 = { package = "bincode", version = "=1.3.3" }
p3-field = "=0.2.3-succinct"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sp1-core-executor = "=5.2.2"
sp1-core-machine = "=5.2.2"
sp1-prover = { version = "=5.2.2", features = ["native-gnark"] }
sp1-stark = "=5.2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
sp1-build = "=5.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
