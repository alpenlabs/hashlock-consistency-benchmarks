[package]
name = "components-sp1-guest"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "2.0"
# Precompile-patched SHA-256, as in the soldering and hashlock guests.
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-4.0.0" }
# Unpatched crates.io SHA-256, the same crate sp1-zkvm uses for its public-values hasher.
sha2_sw = { package = "sha2", version = "0.10.8" }
sp1-zkvm = "5.2.2"
