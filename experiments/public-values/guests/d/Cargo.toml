[package]
name = "pv-d-digest-software"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "2.0"
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-4.0.0" }
sp1-zkvm = "5.2.2"
# Unpatched crates.io sha2, the same crate sp1-zkvm uses for its public-values hasher.
sha2_sw = { package = "sha2", version = "0.10.8" }
